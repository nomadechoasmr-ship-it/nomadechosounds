name: Update video library
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_library.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "nomadechoasmr-ship-it"
          git config user.email "nomadechoasmr-ship-it@users.noreply.github.com"
          git add data/videos.json library/index.html
          git commit -m "Update video library from channel feed"
          git push
